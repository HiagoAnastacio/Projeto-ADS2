server {
    listen 80;

    # Gzip settings for performance
    gzip on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    # --- SERVIR FRONTEND ---
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        
        # Regra SPA: Se não achar o arquivo, redireciona para index.html
        # Isso permite que o React Router controle as rotas
        try_files $uri $uri/ /index.html;
    }

    # --- PROXY REVERSO API ---
    # Redireciona chamadas /api para o backend container
    location /api {
        # O nome "backend" aqui deve bater com o nome do serviço no docker-compose.yml
        proxy_pass http://backend:8000;
        
        # Cabeçalhos importantes para o backend saber quem é o cliente real
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Cache de arquivos estáticos (JS, CSS, Imagens)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc)$ {
        root /usr/share/nginx/html;
        expires 1M;
        access_log off;
        add_header Cache-Control "public";
    }
}
