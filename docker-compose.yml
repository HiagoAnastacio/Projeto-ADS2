version: '3.8'

services:
  # --- Serviço de Banco de Dados (MySQL) ---
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: overwatch_meta_analyzer
      MYSQL_USER: meta_user
      MYSQL_PASSWORD: meta_password
    ports:
      - "3308:3306" # Exposta na 3308 (Evitando conflito na 3306 e 3307)
    volumes:
      # Persistência de dados
      - mysql_data:/var/lib/mysql
      # Script de inicialização (Importa o dump automaticamente no primeiro boot)
      - ./backend/data/database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10

  # --- API Backend (FastAPI) ---
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      # Conexão DB
      DB_HOST: db # Nome do serviço acima
      DB_USER: root # Usando root para garantir permissões totais no init, ou meta_user
      DB_PSWD: rootpassword
      DB_NAME: overwatch_meta_analyzer
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # --- Frontend (React + Nginx Proxy) ---
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "80:80" # Acessível em http://localhost
    depends_on:
      - backend

volumes:
  mysql_data:
